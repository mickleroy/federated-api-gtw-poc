openapi: 3.0.0
info:
  title: Product API
  version: 1.0.0
  description: API for managing products
paths:
  /products:
    get:
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${stageVariables.region}:lambda:path/2015-03-31/functions/${stageVariables.productLambdaFunctionName}/invocations
        passthroughBehavior: when_no_match
        httpMethod: GET
        type: aws_proxy
    post:
      summary: Create product
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${stageVariables.region}:lambda:path/2015-03-31/functions/${stageVariables.productLambdaFunctionName}/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: string
    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: number
        description:
          type: string 