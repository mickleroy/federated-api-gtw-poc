openapi: 3.0.0
info:
  title: Product API
  version: 1.0.0
  description: API for managing products

servers:
- url: https://api.acme.com
  description: Acme API Server

paths:
  /products:
    get:
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      x-amazon-apigateway-integration:
        uri: http://${stageVariables.productAlbDns}/products
        passthroughBehavior: when_no_match
        httpMethod: GET
        type: http_proxy
        connectionType: VPC_LINK
        connectionId: ${stageVariables.vpcLinkId}
    post:
      summary: Create product
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      x-amazon-apigateway-integration:
        uri: http://${stageVariables.productAlbDns}/products
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: http_proxy
        connectionType: VPC_LINK
        connectionId: ${stageVariables.vpcLinkId}
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: string
    ProductInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        price:
          type: number
        description:
          type: string 