openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
  description: API for managing customers

servers:
- url: https://api.acme.com
  description: Acme API Server

paths:
  /customers:
    get:
      summary: List customers
      operationId: listCustomers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
      x-amazon-apigateway-integration:
        uri: http://${stageVariables.customerAlbDns}/customers
        passthroughBehavior: when_no_match
        httpMethod: GET
        type: http_proxy
        connectionType: VPC_LINK
        connectionId: ${stageVariables.vpcLinkId}
    post:
      summary: Create customer
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
      x-amazon-apigateway-integration:
        uri: http://${stageVariables.customerAlbDns}/customers
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: http_proxy
        connectionType: VPC_LINK
        connectionId: ${stageVariables.vpcLinkId}
components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
    CustomerInput:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string 