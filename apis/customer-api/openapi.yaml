openapi: 3.0.0
info:
  title: Customer API
  version: 1.0.0
  description: API for managing customers
paths:
  /customers:
    get:
      summary: List customers
      operationId: listCustomers
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${stageVariables.region}:lambda:path/2015-03-31/functions/${stageVariables.customerLambdaFunctionName}/invocations
        passthroughBehavior: when_no_match
        httpMethod: GET
        type: aws_proxy
    post:
      summary: Create customer
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
      x-amazon-apigateway-integration:
        uri: arn:aws:apigateway:${stageVariables.region}:lambda:path/2015-03-31/functions/${stageVariables.customerLambdaFunctionName}/invocations
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: aws_proxy
components:
  schemas:
    Customer:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
    CustomerInput:
      type: object
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string 