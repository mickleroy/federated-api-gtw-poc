_format_version: "1.0"

# Any final patches the Platform team may want to apply should go here
patches:

  # Add defaults for plugin configurations that the teams can use easily
  - selectors:
    - $._plugin_configs
    values:
      default-jwt:
        key_claim_name: "iss"
        secret_is_base64: false
      default-key-auth:
        key_names: ["apikey"]
        hide_credentials: true
        key_in_body: false
        key_in_header: true
        key_in_query: false